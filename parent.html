<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <title>تطبيق ولي الأمر</title>
  <style>
    body { background:#f0f4ff; font-family:Arial; text-align:center; padding:40px; }
    h1 { color:#0a0f1e; font-size:30px; }
    input[type=text] { width:300px; padding:12px; font-size:18px;
                    border-radius:10px; border:2px solid #dde4f5; margin:10px 0; text-align:center; }
    .btn { background:#00c896; color:white; border:none; padding:15px 40px;
           font-size:20px; border-radius:12px; cursor:pointer;
           display:block; margin:10px auto; width:300px; }
    .btn-red { background:#ef4444; }
    .student-check { background:white; border:2px solid #dde4f5; border-radius:12px;
                     padding:15px; margin:10px auto; width:280px; text-align:right;
                     display:flex; align-items:center; gap:10px; cursor:pointer; }
    .student-check input { width:20px; height:20px; cursor:pointer; }
    .student-check label { font-size:18px; cursor:pointer; flex:1; }
    #شاشة_الاختيار { display:none; }
    #شاشة_الانتظار { display:none; }
  </style>
</head>
<body>

  <div id="شاشة_الرقم">
    <h1>🔐 أهلاً بك</h1>
    <p>أدخل كلمة السر</p>
    <input type="text" id="pin" placeholder="مثال: ab12cd" />
    <button class="btn" id="loginBtn">دخول</button>
    <p id="خطأ" style="color:red;"></p>
  </div>

  <div id="شاشة_الاختيار">
    <h1>🚗 وصلت للمدرسة</h1>
    <p>اختر أبناءك الحاضرين</p>
    <div id="قائمة_أبناء"></div>
    <button class="btn" id="sendBtn">📢 أرسل إشعار للمدرسة</button>
    <p id="رسالة" style="color:#00c896; font-size:18px;"></p>
  </div>

  <div id="شاشة_الانتظار">
    <h1>⏳ بانتظار الاستدعاء</h1>
    <div id="اسماء_المنتظرين"></div>
    <p style="color:#6b7fa3;">سيظهر اسم ابنك على شاشة المدرسة</p>
    <button class="btn btn-red" id="cancelBtn">❌ استلمت أبنائي</button>
  </div>

  <script>
    const URL = 'https://pcfcfiidaaqlmhhdctmk.supabase.co/rest/v1';
    const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjZmNmaWlkYWFxbG1oaGRjdG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjk2ODQsImV4cCI6MjA5NDYwNTY4NH0.wllF4eYEIhdfSEwXNmCxPCtM9eUAw3lyVOSFf6DZnGM';
    const H = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
    let sentIds = [];

    document.getElementById('loginBtn').addEventListener('click', async function() {
      let pin = document.getElementById('pin').value.trim();
      let r = await fetch(URL + '/parents?pin=eq.' + pin, { headers: H });
      let d = await r.json();
      if (!Array.isArray(d) || d.length === 0) {
        document.getElementById('خطأ').innerText = '❌ كلمة السر غلط!';
        return;
      }
      let allStudents = [];
      d.forEach(record => {
        record.students_list.split(',').forEach(s => {
          if (s.trim()) allStudents.push(s.trim());
        });
      });
      let div = document.getElementById('قائمة_أبناء');
      div.innerHTML = '';
      allStudents.forEach((s, i) => {
        div.innerHTML += `
          <div class="student-check">
            <input type="checkbox" id="s${i}" value="${s}" checked>
            <label for="s${i}">${s.replace('|', ' — ')}</label>
          </div>`;
      });
      document.getElementById('شاشة_الرقم').style.display = 'none';
      document.getElementById('شاشة_الاختيار').style.display = 'block';
    });

    document.getElementById('sendBtn').addEventListener('click', async function() {
      let checked = document.querySelectorAll('#قائمة_أبناء input:checked');
      if (checked.length === 0) {
        document.getElementById('رسالة').innerText = '❌ اختر ابن واحد على الأقل!';
        return;
      }
      sentIds = [];
      let names = [];
      for (let cb of checked) {
        let parts = cb.value.split('|');
        let r = await fetch(URL + '/students', {
          method: 'POST',
          headers: { ...H, 'Prefer': 'return=representation' },
          body: JSON.stringify({ name: parts[0], Class: parts[1] })
        });
        let d = await r.json();
        if (r.ok && d[0]) {
          sentIds.push(d[0].id);
          names.push(parts[0]);
        }
      }
      document.getElementById('اسماء_المنتظرين').innerHTML =
        names.map(n => `<p>👦 ${n}</p>`).join('');
      document.getElementById('شاشة_الاختيار').style.display = 'none';
      document.getElementById('شاشة_الانتظار').style.display = 'block';
    });

    document.getElementById('cancelBtn').addEventListener('click', async function() {
      for (let id of sentIds) {
        await fetch(URL + '/students?id=eq.' + id, { method: 'DELETE', headers: H });
      }
      sentIds = [];
      document.getElementById('شاشة_الانتظار').style.display = 'none';
      document.getElementById('شاشة_الاختيار').style.display = 'block';
    });
  </script>
</body>
</html>
